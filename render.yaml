# render.yaml: a Render "Blueprint".
# -----------------------------------------------------------------------------
# Instead of clicking every setting into the Render dashboard, this file
# describes the service as code. In Render choose New > Blueprint, pick this
# repo, and Render creates everything below. Change this file and push, and
# Render updates the service to match. (Full walkthrough: README, "Deploying".)
#
# Spec: https://render.com/docs/blueprint-spec
# -----------------------------------------------------------------------------
services:
  - type: web
    name: forest-sanctuary
    runtime: node

    # The cheapest PAID instance (about $7/month). The free plan can't keep a
    # persistent disk, and without one the SQLite file (users, invites,
    # sessions) is wiped on every deploy and restart. See the README.
    plan: 0.5c-512mb

    # `npm ci` installs exactly what package-lock.json lists. --omit=dev
    # skips nodemon, which only matters on your laptop.
    buildCommand: npm ci --omit=dev
    startCommand: npm start

    # Render calls this URL to check the app is alive (see server.js).
    healthCheckPath: /healthz

    # The persistent disk. Only files under mountPath survive deploys and
    # restarts; the rest of the server's filesystem is thrown away each time.
    # 1 GB is plenty for a site like this (about $0.25/month).
    disk:
      name: forest-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # Turns on secure cookies, trust proxy and the SESSION_SECRET check.
      - key: NODE_ENV
        value: production

      # Put the database on the persistent disk.
      - key: DATABASE_PATH
        value: /var/data/forest.db

      # Render makes a random secret once and keeps it. You never need to
      # see it. (Changing it later logs everyone out.)
      - key: SESSION_SECRET
        generateValue: true

      # How many proxies sit in front of the app. Check /admin/connection
      # after deploying, and change this in the dashboard if your IP is wrong.
      - key: TRUST_PROXY
        value: "1"

      # No APP_URL needed: Render sets RENDER_EXTERNAL_URL (your
      # https://....onrender.com address) by itself, and `npm run invite`
      # uses it. Set APP_URL only if you add a custom domain later.
