<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Forest Sanctuary</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <h1>Log in</h1>

    <!--
      method="post" sends the fields in the request body (not the URL, where
      they would show up in browser history and server logs).
      action="/login" is the route in routes/auth.js that receives them.
    -->
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" required autocomplete="username">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required
             autocomplete="current-password">

      <button type="submit">Log in</button>
    </form>

    <p>New here? Forest Sanctuary is invite only: ask a member for an invite link.</p>
  </main>
</body>
</html>
